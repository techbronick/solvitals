name: refresh

on:
  schedule:
    # Every 15 minutes. GitHub throttles scheduled runs under load, so treat
    # this as a floor rather than a guarantee.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install step: SolPulse is standard library only.
      # Runners are ephemeral, so without this the on-disk TTL cache never
      # survives a run and the large upstream payloads are refetched every time.
      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: solpulse-cache-${{ github.run_id }}
          restore-keys: solpulse-cache-

      - name: Generate report
        run: python3 main.py --output-dir docs --quiet

      - name: Commit refreshed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: refresh report [skip ci]"
          git push
